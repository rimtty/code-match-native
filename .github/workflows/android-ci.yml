name: Android CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: android

env:
  JAVA_VERSION: "21"

jobs:
  android-unit-lint:
    name: Android unit, lint, and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902

      - name: Select current Android SDK CLI
        run: |
          mv "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/android-cmdline-tools-previous"
          ln -s "$ANDROID_HOME/cmdline-tools/15859902" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK 37.0
        run: sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Install release verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep libxml2-utils

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show tool versions
        run: |
          java -version
          ./gradlew --version

      - name: Assemble, lint, and run JVM tests
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest --stacktrace

      - name: Verify release hardening source contract
        run: bash scripts/test-release-hardening.sh

  android-emulator-test:
    name: Android emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # API 37 runtime images are currently unavailable for Linux x86_64.
        # compileSdk/targetSdk 37 are covered by the build jobs; API 37 runtime
        # tests run locally on Apple Silicon until the hosted image is published.
        api-level: [31, 36]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902

      - name: Select current Android SDK CLI
        run: |
          mv "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/android-cmdline-tools-previous"
          ln -s "$ANDROID_HOME/cmdline-tools/15859902" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK 37.0
        run: sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Compose and instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          working-directory: android
          script: bash scripts/run-connected-tests.sh

  android-release-build:
    name: Android release build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902

      - name: Select current Android SDK CLI
        run: |
          mv "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/android-cmdline-tools-previous"
          ln -s "$ANDROID_HOME/cmdline-tools/15859902" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK 37.0
        run: sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Install release verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep libxml2-utils

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release APK and app bundle
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify release hardening and dependency graph
        shell: bash
        run: |
          dependency_report="$RUNNER_TEMP/codematch-release-dependencies.txt"
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > "$dependency_report"
          bash scripts/verify-release-hardening.sh \
            --apk app/build/outputs/apk/release/app-release-unsigned.apk \
            --aab app/build/outputs/bundle/release/app-release.aab \
            --dependency-report "$dependency_report"

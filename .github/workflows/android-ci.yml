name: Android CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: android

env:
  JAVA_VERSION: "21"

jobs:
  android-unit-lint:
    name: Android unit, lint, and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902

      - name: Select current Android SDK CLI
        run: |
          mv "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/android-cmdline-tools-previous"
          ln -s "$ANDROID_HOME/cmdline-tools/15859902" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK 37.0
        run: sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show tool versions
        run: |
          java -version
          ./gradlew --version

      - name: Assemble, lint, and run JVM tests
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest --stacktrace

  android-emulator-test:
    name: Android emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # API 37 runtime images are currently unavailable for Linux x86_64.
        # compileSdk/targetSdk 37 are covered by the build jobs; API 37 runtime
        # tests run locally on Apple Silicon until the hosted image is published.
        api-level: [31, 36]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902

      - name: Select current Android SDK CLI
        run: |
          mv "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/android-cmdline-tools-previous"
          ln -s "$ANDROID_HOME/cmdline-tools/15859902" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK 37.0
        run: sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Compose and instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest --stacktrace

  android-release-build:
    name: Android release build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902

      - name: Select current Android SDK CLI
        run: |
          mv "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/android-cmdline-tools-previous"
          ln -s "$ANDROID_HOME/cmdline-tools/15859902" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK 37.0
        run: sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify release manifest and dependency graph
        shell: bash
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > release-dependencies.txt
          if grep -Fq ":scanner:fake" release-dependencies.txt; then
            echo "Fake scanner leaked into the release dependency graph" >&2
            exit 1
          fi

          merged_manifest="$(find app/build/intermediates -type f -path '*merged_manifest/release*AndroidManifest.xml' -print -quit)"
          manifest_path="${merged_manifest:-app/src/main/AndroidManifest.xml}"
          if grep -Eq 'android\.permission\.INTERNET|android:debuggable[[:space:]]*=[[:space:]]*"true"|scanner[:/.]fake' "$manifest_path"; then
            echo "Release manifest contains an unexpected network, debug, or fake-scanner entry: $manifest_path" >&2
            exit 1
          fi

name: Android CI

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'shared/**'
      - '.github/workflows/android-ci.yml'
      - '.github/actions/setup-android/**'
  pull_request:
    paths:
      - 'android/**'
      - 'shared/**'
      - '.github/workflows/android-ci.yml'
      - '.github/actions/setup-android/**'
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  android-unit-lint:
    name: Android unit, lint, and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Android toolchain
        uses: ./.github/actions/setup-android

      # :scanner:inateck is compiled for lint and JVM tests even though the
      # debug app does not depend on it, so the pinned SDK binaries are needed.
      - name: Install pinned Inateck SDK binaries
        run: bash scripts/setup-inateck-sdk.sh

      - name: Assemble, lint, and run JVM tests
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest --stacktrace

  android-emulator-test:
    name: Android emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Android toolchain
        uses: ./.github/actions/setup-android

      # API 36 matches the only target device (Pixel 7). Hosted Linux images for
      # API 37 are not available yet; compile/target SDK 37 is covered by the
      # build jobs.
      - name: Run Compose and instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          working-directory: android
          script: bash scripts/run-connected-tests.sh

  android-release-build:
    name: Android release build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Android toolchain
        uses: ./.github/actions/setup-android

      - name: Install pinned Inateck SDK binaries
        run: bash scripts/setup-inateck-sdk.sh

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify release APK and dependency graph
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/codematch-release-dependencies.txt"
          bash scripts/verify-release-hardening.sh --dependency-report "$RUNNER_TEMP/codematch-release-dependencies.txt"

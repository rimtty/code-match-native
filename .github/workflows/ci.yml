name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: >
          xcodebuild build
          -project CodeMatch.xcodeproj
          -scheme CodeMatch
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

      - name: Install pinned Inateck SDK
        run: ./scripts/bootstrap_inateck_sdk.sh

      - name: Build generic iOS device
        run: >
          xcodebuild build
          -project CodeMatch.xcodeproj
          -scheme CodeMatch
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Unit tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(dev['udid'] for k,v in d.items() if 'iOS' in k for dev in v if dev['isAvailable'] and 'iPhone' in dev['name']))")
          echo "Using simulator $DEVICE_ID"
          xcodebuild test \
            -project CodeMatch.xcodeproj \
            -scheme CodeMatch \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:CodeMatchTests \
            CODE_SIGNING_ALLOWED=NO

  ui-test:
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test:
          - testMockBluetoothScannerConnectsAndCompletesMatch
          - testScannerFlowMatchDuplicateResetAndMismatch
          - testSessionAutoAdvanceShowsCountdownAndStartsNextMatch
          - testSessionCanStartAndShowsMatchCount
          - testSettingsDiscoversAndConnectsMockScanner
          - testSettingsLanguageSwitchPersistsAcrossRelaunch
          - testSettingsTabAllowsSoundSelection
    steps:
      - uses: actions/checkout@v4

      - name: UI test (${{ matrix.test }})
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(dev['udid'] for k,v in d.items() if 'iOS' in k for dev in v if dev['isAvailable'] and 'iPhone' in dev['name']))")
          echo "Using simulator $DEVICE_ID"
          # Each UI test gets a clean simulator so a stalled XCTest session
          # cannot poison the remaining coverage.
          xcrun simctl shutdown "$DEVICE_ID" || true
          xcrun simctl erase "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild test \
            -project CodeMatch.xcodeproj \
            -scheme CodeMatch \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:CodeMatchUITests/CodeMatchUITests/${{ matrix.test }} \
            CODE_SIGNING_ALLOWED=NO

name: iOS CI

on:
  push:
    branches: [master]
    paths:
      - 'ios/**'
      - 'shared/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'shared/**'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ios

jobs:
  device-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install pinned Inateck SDK
        run: ./scripts/bootstrap_inateck_sdk.sh

      - name: Build generic iOS device
        run: >
          xcodebuild build
          -project CodeMatch.xcodeproj
          -scheme CodeMatch
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO

  simulator-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        id: xcode
        run: |
          xcodebuild -version
          echo "key=$(xcodebuild -version | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      # Kick off the simulator boot in the background so it warms up while the
      # cache restore and build run; the later bootstatus step synchronizes.
      - name: Start simulator boot
        id: sim
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(dev['udid'] for k,v in d.items() if 'iOS' in k for dev in v if dev['isAvailable'] and 'iPhone' in dev['name']))")
          echo "Using simulator $DEVICE_ID"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          nohup xcrun simctl bootstatus "$DEVICE_ID" -b >/dev/null 2>&1 &

      # irgaly/xcode-cache also restores source mtimes so restored DerivedData
      # actually yields an incremental build (plain actions/cache does not).
      - name: Restore DerivedData cache
        uses: irgaly/xcode-cache@4141f139f00e335c6e1031fb93e667181f86146f # v1.9.2
        with:
          key: deriveddata-${{ steps.xcode.outputs.key }}-${{ github.sha }}
          restore-keys: deriveddata-${{ steps.xcode.outputs.key }}-
          deriveddata-directory: ios/DerivedData

      - name: Build for testing
        run: >
          xcodebuild build-for-testing
          -project CodeMatch.xcodeproj
          -scheme CodeMatch
          -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}"
          -derivedDataPath DerivedData
          COMPILER_INDEX_STORE_ENABLE=NO
          CODE_SIGNING_ALLOWED=NO

      - name: Wait for simulator boot
        run: xcrun simctl bootstatus "${{ steps.sim.outputs.id }}" -b

      # One invocation for unit + UI tests: xcodebuild startup costs ~40s on
      # these runners, so paying it once instead of twice is a real saving.
      # Per-test execution-time allowances kill a stalled XCTest session instead
      # of letting it eat the whole job, and failed tests get retried once
      # before the job is marked red.
      - name: Unit & UI tests
        run: >
          xcodebuild test-without-building
          -project CodeMatch.xcodeproj
          -scheme CodeMatch
          -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}"
          -derivedDataPath DerivedData
          -test-timeouts-enabled YES
          -default-test-execution-time-allowance 180
          -maximum-test-execution-time-allowance 360
          -retry-tests-on-failure
          -test-iterations 2
          CODE_SIGNING_ALLOWED=NO
